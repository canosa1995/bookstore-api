# ===============================
# BANCO DE DADOS ORACLE
# ===============================

# Endereço JDBC do Oracle.
# localhost = Oracle está acessível pela própria máquina/WSL.
# 1521 = porta do Oracle Listener.
# XEPDB1 = serviço/PDB onde criamos o BOOKSTORE.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1

# Usuário/schema que criamos no Oracle.
spring.datasource.username=BOOKSTORE

# A senha não será escrita diretamente neste arquivo.
# O Spring buscará o valor na variável de ambiente BOOKSTORE_DB_PASSWORD.
spring.datasource.password=${BOOKSTORE_DB_PASSWORD}

# Driver JDBC utilizado para conversar com o Oracle.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ===============================
# JPA / HIBERNATE
# ===============================

# Por enquanto o Hibernate NÃO deve criar,
# alterar nem apagar tabelas do Oracle.
spring.jpa.hibernate.ddl-auto=validate

# Mostra no console os SQLs executados pelo Hibernate.
# Será útil durante nosso aprendizado.
spring.jpa.show-sql=true
